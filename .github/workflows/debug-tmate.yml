# Interactive debug session on a GitHub runner — for developing without a
# local Rust toolchain. Opens an SSH tunnel FIRST (fail fast in ~2 min if the
# public relay refuses the runner), then builds the web frontend +
# codeg-server/codeg-mcp, then parks the job for up to ~6h.
#
# The public tmate.io relay is dead (nyc1.tmate.io no longer resolves
# anywhere), so the runner exposes its own sshd through bore.pub instead.
#
# Usage:
#   gh workflow run debug-tmate.yml --repo truongtv22/codeg --ref ci/debug-tmate
#   Connection commands are published as the `tmate-connection` artifact
#   (downloadable while the job runs) and also printed in the step logs.
#
# Only SSH keys registered on the triggering GitHub account may connect.
# sshd survives disconnects — reconnect any time.
#
# Inside the session, once the build finishes, serve the app:
#   CODEG_STATIC_DIR=out CODEG_PORT=8787 ./src-tauri/target/release/codeg-server
# Then forward the port through the SAME ssh connection:
#   ssh -L 8787:localhost:8787 -p <port> runner@bore.pub
# and open http://localhost:8787 locally.

name: Debug session (SSH via bore)

on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH tunnel
        env:
          ACTOR: ${{ github.actor }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server jq
          sudo ssh-keygen -A
          sudo service ssh start || sudo /usr/sbin/sshd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Only keys registered on the triggering GitHub account may connect.
          curl -sf https://api.github.com/users/$ACTOR/keys | jq -r '.[].key' \
            >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          BORE_VER=0.5.0
          curl -sL "https://github.com/ekzhang/bore/releases/download/v${BORE_VER}/bore-v${BORE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin bore

          nohup bore local 22 --to bore.pub > /tmp/bore.log 2>&1 &
          PORT=""
          # Parse the public port bore assigned (format varies by version:
          # `remote_port=NNNNN` or `bore.pub:NNNNN`).
          for i in $(seq 1 20); do
            PORT=$(grep -oE "remote_port=[0-9]+|bore\.pub:[0-9]+" /tmp/bore.log \
              | grep -oE "[0-9]+$" | head -1)
            [ -n "$PORT" ] && break
            sleep 2
          done
          if [ -z "$PORT" ]; then
            echo "FATAL: bore tunnel not established"
            cat /tmp/bore.log
            exit 1
          fi

          cat > /tmp/connection.txt <<EOF
          Connect:      ssh -p $PORT runner@bore.pub
          Port-forward: ssh -L 8787:localhost:8787 -p $PORT runner@bore.pub
          EOF
          cat /tmp/connection.txt

      - name: Publish connection info
        uses: actions/upload-artifact@v4
        with:
          name: tmate-connection
          path: /tmp/connection.txt
          retention-days: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Debug sessions usually end by disconnect (job marked failed), so
      # save the build cache regardless — next session skips the cold build.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: debug-tmate
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server + codeg-mcp
        working-directory: src-tauri
        run: |
          cargo build --release --bin codeg-server --no-default-features
          cargo build --release --bin codeg-mcp --no-default-features

      # Holds the job open; sshd keeps serving on reconnect.
      - name: Keep session alive
        timeout-minutes: 355
        run: sleep 21600
