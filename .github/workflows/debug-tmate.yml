# Interactive debug session on a GitHub runner — for developing without a
# local Rust toolchain. Builds the web frontend + codeg-server/codeg-mcp,
# then opens a tmate SSH session with the binary ready to run.
#
# Usage:
#   gh workflow run debug-tmate.yml --repo truongtv22/codeg --ref <branch>
#   (SSH connection string appears in the "Debug session" step logs)
#
# Inside the session, serve the app:
#   CODEG_STATIC_DIR=out CODEG_PORT=8787 ./src-tauri/target/release/codeg-server
# Then from the client machine (port forward through the tmate session):
#   ssh -L 8787:localhost:8787 <tmate-ssh-string>
# and open http://localhost:8787 locally.

name: Debug session (tmate)

on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  HUSKY: 0

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Debug sessions usually end by disconnect (job marked failed), so
      # save the build cache regardless — next session skips the cold build.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: debug-tmate
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server + codeg-mcp
        working-directory: src-tauri
        run: |
          cargo build --release --bin codeg-server --no-default-features
          cargo build --release --bin codeg-mcp --no-default-features

      # Manual tmate instead of mxschmitt/action-tmate: the action's connection
      # string only appears in job logs, which GitHub serves AFTER the job ends
      # (session over by then). Writing it to an artifact makes it downloadable
      # while the session is live. Daemon mode (`new-session -d`) also survives
      # SSH disconnects — the action does not.
      - name: Start tmate session
        env:
          ACTOR: ${{ github.actor }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tmate
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Same guarantee as the action's limit-access-to-actor: only keys
          # registered on the triggering account may connect.
          curl -sf https://api.github.com/users/$ACTOR/keys | jq -r '.[].key' \
            >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          tmate -S /tmp/tmate.sock new-session -d
          sleep 3
          tmate -S /tmp/tmate.sock show-messages | tee /tmp/tmate-messages.txt

      - name: Publish connection info
        uses: actions/upload-artifact@v4
        with:
          name: tmate-connection
          path: /tmp/tmate-messages.txt
          retention-days: 1

      # Holds the job open; the tmate daemon keeps serving on reconnect.
      - name: Keep session alive
        timeout-minutes: 355
        run: sleep 21600
