# Interactive debug session on a GitHub runner — for developing without a
# local Rust toolchain. Opens an SSH tunnel FIRST (fail fast in ~2 min if the
# public relay refuses the runner), then builds the web frontend +
# codeg-server/codeg-mcp, then parks the job for up to ~6h.
#
# The public tmate.io relay is dead (nyc1.tmate.io no longer resolves
# anywhere), so the runner exposes its own sshd through bore.pub instead.
#
# Usage:
#   gh workflow run debug-tmate.yml --repo truongtv22/codeg --ref ci/debug-tmate
#   Connection commands are published as the `tmate-connection` artifact
#   (downloadable while the job runs) and also printed in the step logs.
#
# Only SSH keys registered on the triggering GitHub account may connect.
# sshd survives disconnects — reconnect any time.
#
# After the build, codeg-server auto-starts (pinned CODEG_TOKEN, see env
# below). From the client machine, forward the port through the SSH
# connection:
#   ssh -L 8787:localhost:8787 -p <port> runner@bore.pub
# then open http://localhost:8787 and enter the access token.

name: Debug session (SSH via bore)

on:
  workflow_dispatch:

env:
  RUST_BACKTRACE: short
  HUSKY: 0
  # Access token the web UI asks for. Default is fine for throwaway debug
  # sessions: the real gate is SSH-key auth on the tunnel, and the port
  # rotates per session. Set the CODEG_TOKEN secret to pin your own.
  CODEG_TOKEN: ${{ secrets.CODEG_TOKEN || 'codeg-debug-8787' }}

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Start SSH tunnel
        env:
          ACTOR: ${{ github.actor }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server jq
          sudo ssh-keygen -A
          sudo service ssh start || sudo /usr/sbin/sshd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Only keys registered on the triggering GitHub account may connect.
          curl -sf https://api.github.com/users/$ACTOR/keys | jq -r '.[].key' \
            >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

          BORE_VER=0.5.0
          curl -sL "https://github.com/ekzhang/bore/releases/download/v${BORE_VER}/bore-v${BORE_VER}-x86_64-unknown-linux-musl.tar.gz" \
            | sudo tar xz -C /usr/local/bin bore

          nohup bore local 22 --to bore.pub > /tmp/bore.log 2>&1 &
          PORT=""
          # Parse the public port bore assigned (format varies by version:
          # `remote_port=NNNNN` or `bore.pub:NNNNN`).
          for i in $(seq 1 20); do
            PORT=$(grep -oE "remote_port=[0-9]+|bore\.pub:[0-9]+" /tmp/bore.log \
              | grep -oE "[0-9]+$" | head -1)
            [ -n "$PORT" ] && break
            sleep 2
          done
          if [ -z "$PORT" ]; then
            echo "FATAL: bore tunnel not established"
            cat /tmp/bore.log
            exit 1
          fi

          cat > /tmp/connection.txt <<EOF
          Connect:      ssh -p $PORT runner@bore.pub
          Port-forward: ssh -L 8787:localhost:8787 -p $PORT runner@bore.pub
          EOF
          cat /tmp/connection.txt

      - name: Publish connection info
        uses: actions/upload-artifact@v4
        with:
          name: tmate-connection
          path: /tmp/connection.txt
          retention-days: 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Debug sessions usually end by disconnect (job marked failed), so
      # save the build cache regardless — next session skips the cold build.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: debug-tmate
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Build frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build server + companions
        working-directory: src-tauri
        # Feature flags track upstream release.yml — they drifted when
        # upstream split the bins behind `server-bin`/`mcp-bin` features.
        run: |
          cargo build --release --bin codeg-server --no-default-features --features server-bin
          cargo build --release --bin codeg-mcp --no-default-features --features mcp-bin
          cargo build --release --bin codeg-computer-helper --no-default-features --features computer-helper

      # Serve the app immediately — the client only needs the SSH tunnel,
      # no manual server start inside the session.
      - name: Start codeg-server
        run: |
          CODEG_STATIC_DIR=out CODEG_PORT=8787 \
            nohup ./src-tauri/target/release/codeg-server </dev/null \
            > /tmp/codeg-server.log 2>&1 &
          disown
          sleep 4
          curl -s -o /dev/null -w "server http: %{http_code}\n" --max-time 5 \
            http://localhost:8787

      # Telegram ping so the session can be picked up even when the local
      # keeper/Mac is asleep. No-ops when the secrets are not configured.
      - name: Notify Telegram (session ready)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "telegram not configured; skip"; exit 0; }
          PORT=$(grep -oE "ssh -p [0-9]+" /tmp/connection.txt | grep -oE "[0-9]+" | head -1)
          TEXT="✅ ${GITHUB_REPOSITORY} — debug session ready
          ssh -p ${PORT} runner@bore.pub
          App: http://localhost:8787 (tunnel từ máy bạn)
          Token: giá trị secret CODEG_TOKEN"
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" --data-urlencode "text=$TEXT" > /dev/null
          echo "telegram notified"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode "text=❌ ${GITHUB_REPOSITORY} — debug session FAILED (run ${GITHUB_RUN_ID})" \
            > /dev/null

      # Holds the job open; sshd keeps serving on reconnect.
      # 290 min (not 355) so the approval gate below still fits inside the
      # 6h job cap even after a cold ~35 min build.
      - name: Keep session alive
        timeout-minutes: 300
        run: sleep 17400

      # Telegram approval gate: session stays usable while waiting (the VM
      # is alive until this job ends). 20 min to answer, then stop the chain.
      # The decision is echoed as GATE_DECISION=... so the local keeper can
      # spawn the successor with its own gh auth — no PAT needed here
      # (GITHUB_TOKEN cannot trigger workflow_dispatch).
      - name: Ask Telegram approval to respawn
        id: gate
        if: '!cancelled()'
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request

          TOKEN, CHAT = os.environ["TOKEN"], os.environ["CHAT"]
          WINDOW = 20 * 60

          def call(method, **p):
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{TOKEN}/{method}",
                  data=urllib.parse.urlencode(p).encode())
              with urllib.request.urlopen(req, timeout=35) as r:
                  return json.load(r)

          def edit(mid, text):
              try:
                  call("editMessageText", chat_id=CHAT, message_id=mid, text=text)
              except Exception:
                  pass

          def emit(ok, denied):
              decision = "approved" if ok else ("denied" if denied else "timeout")
              print(f"GATE_DECISION={decision}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"approved={'true' if ok else 'false'}\n")

          try:
              sent = call("sendMessage", chat_id=CHAT,
                  text="🐈 Codeg session sắp hết hạn. Tạo run mới?",
                  reply_markup=json.dumps({"inline_keyboard": [[
                      {"text": "✅ Tạo run mới", "callback_data": "respawn_yes"},
                      {"text": "⛔ Dừng chuỗi", "callback_data": "respawn_no"}]]}))
              mid = sent["result"]["message_id"]
          except Exception as e:
              print(f"gate send failed: {e}")
              emit(False, False)
              sys.exit(0)

          deadline, offset, approved, denied = time.time() + WINDOW, 0, False, False
          while time.time() < deadline:
              try:
                  req = urllib.request.Request(
                      f"https://api.telegram.org/bot{TOKEN}/getUpdates?timeout=25"
                      f"&offset={offset}&allowed_updates=%5B%22callback_query%22%5D")
                  with urllib.request.urlopen(req, timeout=35) as r:
                      payload = json.load(r)
              except Exception as e:
                  print(f"poll error, retry: {e}")
                  time.sleep(5)
                  continue
              for upd in payload.get("result", []):
                  offset = max(offset, upd["update_id"] + 1)
                  cq = upd.get("callback_query", {})
                  if cq.get("message", {}).get("message_id") != mid:
                      continue
                  call("answerCallbackQuery", callback_query_id=cq["id"])
                  if cq.get("data") == "respawn_yes":
                      edit(mid, "✅ Đã duyệt — keeper sẽ tạo run mới")
                      approved = True
                      break
                  elif cq.get("data") == "respawn_no":
                      edit(mid, "⛔ Không tạo run mới")
                      denied = True
                      break
          emit(approved, denied)
          PY

  # Parallel job: a desktop bundle the client Mac can install and use as the
  # daily driver (no local Rust toolchain needed). Built from the SAME commit
  # as the runner's server, so client and server never drift.
  build-desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # Native build: the runner host triple IS aarch64-apple-darwin, so the
      # host-fallback sidecar staging in beforeBuildCommand is correct here.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: desktop-darwin
          cache-on-failure: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Updater artifacts are off: they need the release signing key that a
      # debug build does not have. Without an Apple Developer identity Tauri
      # ad-hoc signs — the client Mac needs a one-time Gatekeeper bypass
      # (`xattr -cr /Applications/Codeg.app` or right-click > Open).
      - name: Build desktop bundle
        run: >
          pnpm tauri build --target aarch64-apple-darwin
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Package
        run: |
          APP=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos \
            -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "FATAL: .app bundle not found"; exit 1; }
          ditto -c -k --keepParent "$APP" codeg-desktop-darwin-arm64.zip
          ls -la codeg-desktop-darwin-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeg-desktop-darwin-arm64
          path: codeg-desktop-darwin-arm64.zip
          retention-days: 3

      - name: Notify Telegram (desktop ready)
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "telegram not configured; skip"; exit 0; }
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="$CHAT" \
            --data-urlencode "text=📦 ${GITHUB_REPOSITORY} — desktop app macOS arm64 đã build xong
          Tải artifact 'codeg-desktop-darwin-arm64':
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            > /dev/null
          echo "telegram notified"
